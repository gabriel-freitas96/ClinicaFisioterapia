<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestão e atendimento da Clínica Joelma Negreiros Fisioterapia.">
    <meta name="theme-color" content="#ffffff">

    <title>Joelma Negreiros | Fisioterapia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚕️</text></svg>">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div id="toastArea" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;"></div>
    <div id="loginScreen" class="login-screen">
        <div class="login-card">

            <div class="text-center">
                <div class="brand-logo">
                    <img src="assets/img2.png" alt="Logo Joelma Negreiros Fisioterapia">
                </div>
                <span class="login-eyebrow">Joelma Negreiros</span>
                <h1>Fisioterapia</h1>
                <p>Entre para acessar o sistema da clínica.</p>
            </div>

            <form class="login-form" onsubmit="event.preventDefault(); login();">

                <div class="form-field">
                    <label class="form-label" for="loginEmail">E-mail</label>
                    <div class="input-icon">
                        <i class="bi bi-envelope"></i>
                        <input id="loginEmail" type="email" class="form-control" placeholder="seu@email.com"
                            autocomplete="username" required>
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-label" for="loginPassword">Senha</label>
                    <div class="input-icon">
                        <i class="bi bi-lock"></i>
                        <input id="loginPassword" type="password" class="form-control" placeholder="Sua senha"
                            autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Entrar</button>
                <button type="button" class="btn btn-outline-primary w-100" onclick="openRegisterModal()">
                    Criar conta de paciente
                </button>
            </form>

            <div class="login-footer">
                <i class="bi bi-shield-check"></i>Acesso seguro
            </div>
        </div>
    </div>
    <div id="app" class="d-none">

        <div id="sidebarContainer">
            <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

            <aside id="sidebar" class="sidebar">

                <div class="sidebar-brand">
                    <div class="sidebar-logo">
                        <img src="assets/img2.png" alt="Logo">
                    </div>
                    <div class="sidebar-brand-text">
                        <strong>Joelma Negreiros</strong>
                        <small>Fisioterapia</small>
                    </div>
                </div>

                <div class="profile-box">
                    <div id="profileAvatar" class="avatar">JN</div>
                    <div class="profile-info">
                        <strong id="profileName">Usuário</strong>
                        <small id="profileRole">Administrador</small>
                    </div>
                </div>
                <nav id="adminMenu" class="menu-list d-none">
                    <span class="menu-section-title">Gestão</span>
                    <button class="menu-link" data-page="dashboard"><i class="bi bi-house"></i> Início</button>
                    <button class="menu-link" data-page="agenda"><i class="bi bi-calendar3"></i> Agenda</button>
                    <button class="menu-link" data-page="pacientes"><i class="bi bi-people"></i> Pacientes</button>
                    <button class="menu-link" data-page="avaliacoes"><i class="bi bi-clipboard2-pulse"></i> Avaliações</button>
                    <button class="menu-link" data-page="pagamentos"><i class="bi bi-cash-coin"></i> Pagamentos</button>
                    <button class="menu-link" data-page="relatorios"><i class="bi bi-bar-chart"></i> Relatórios</button>
                </nav>
                <nav id="userMenu" class="menu-list d-none">
                    <span class="menu-section-title">Minha área</span>
                    <button class="menu-link" data-page="meu-dashboard"><i class="bi bi-house"></i> Início</button>
                    <button class="menu-link" data-page="minhas-consultas"><i class="bi bi-calendar3"></i> Minhas consultas</button>
                    <button class="menu-link" data-page="minhas-avaliacoes"><i class="bi bi-clipboard2-pulse"></i> Minhas avaliações</button>
                    <button class="menu-link" data-page="meus-pagamentos"><i class="bi bi-cash-coin"></i> Meus pagamentos</button>
                </nav>

                <div class="sidebar-footer">
                    <button class="menu-link logout-link" onclick="logout()">
                        <i class="bi bi-box-arrow-left"></i> Sair
                    </button>
                </div>
            </aside>
        </div>

        <main class="main-content">

            <div id="topbarContainer">
                <header class="topbar">
                    <div class="topbar-left">
                        <button class="mobile-menu-button" onclick="toggleSidebar()" aria-label="Abrir menu">
                            <i class="bi bi-list"></i>
                        </button>
                        <div class="page-heading">
                            <span id="breadcrumb" class="breadcrumb-text">Gestão da clínica</span>
                            <h2 id="pageTitle">Início</h2>
                        </div>
                    </div>

                    <div class="top-actions">
                        <span id="todayData" class="data-pill"></span>
                        <button class="theme-button" onclick="toggleTheme()" aria-label="Alternar tema">
                            <i class="bi bi-moon-stars"></i>
                        </button>
                        <div id="topProfileAvatar" class="avatar avatar-small">JN</div>
                    </div>
                </header>
            </div>

            <section id="pageContent" class="page-content"></section>

        </main>
    </div>
    <div id="modalContainer">

        <!-- Criar conta -->
        <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Criar conta de paciente</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label" for="registerName">Nome completo</label>
                                <input id="registerName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="registerPhone">Telefone</label>
                                <input id="registerPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="15" class="form-control" placeholder="(85) 99999-9999" oninput="this.value = formatPhone(this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="registerGoal">Motivo da consulta</label>
                                <input id="registerGoal" class="form-control" placeholder="Ex.: dor lombar">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="registerEmail">E-mail</label>
                                <input id="registerEmail" type="email" class="form-control" required>
                            </div>
                            <div class="mb-1">
                                <label class="form-label" for="registerPassword">Senha (mínimo 8 caracteres, com letra e número)</label>
                                <input id="registerPassword" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="registerPatient(this)">Criar conta</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Paciente (novo / editar) -->
        <div class="modal fade" id="patientModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 id="patientModalTitle" class="modal-title">Novo paciente</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="patientForm">
                            <input type="hidden" id="pacienteId">
                            <div class="mb-3">
                                <label class="form-label" for="patientName">Nome</label>
                                <input id="patientName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="patientPhone">Telefone</label>
                                <input id="patientPhone" class="form-control" placeholder="(85) 99999-9999">
                            </div>
                            <div class="mb-1">
                                <label class="form-label" for="patientGoal">Motivo da consulta</label>
                                <input id="patientGoal" class="form-control" placeholder="Ex.: reabilitação de joelho">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="savePatient(this)">Salvar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Consulta -->
        <div class="modal fade" id="appointmentModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Agendar consulta</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="appointmentForm">
                            <div class="mb-3">
                                <label class="form-label" for="appointmentPatient">Paciente</label>
                                <input id="appointmentPatient" class="form-control" list="appointmentPatientList" placeholder="Digite o nome do paciente" autocomplete="off" required>
                                <datalist id="appointmentPatientList"></datalist>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="appointmentType">Tipo de atendimento</label>
                                <select id="appointmentType" class="form-select" required>
                                    <option>Avaliação inicial</option>
                                    <option>Sessão de fisioterapia</option>
                                    <option>Retorno</option>
                                    <option>Pilates</option>
                                    <option>Massoterapia</option>
                                </select>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label" for="appointmentData">Data</label>
                                    <input id="appointmentData" type="date" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label" for="appointmentHorario">Horário</label>
                                    <input id="appointmentHorario" type="time" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-1">
                                <label class="form-label" for="appointmentNote">Observações</label>
                                <textarea id="appointmentNote" class="form-control" rows="2"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="saveAppointment(this)">Agendar</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="assessmentModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="assessmentModalTitle">
                            Nova avaliação física
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="assessmentForm">
                            <input
                                type="hidden"
                                id="assessmentId"
                                value=""
                            >
                            <div class="mb-3">
                                <label class="form-label" for="assessmentPatient">Paciente</label>
                                <select id="assessmentPatient" class="form-select" required></select>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6 col-md-3">
                                    <label class="form-label" for="weight">Peso (kg)</label>
                                    <input id="weight" type="number" step="0.1" min="0" class="form-control">
                                </div>
                                <div class="col-6 col-md-3">
                                    <label class="form-label" for="height">Altura (cm)</label>
                                    <input id="height" type="number" step="1" min="0" class="form-control">
                                </div>
                                <div class="col-6 col-md-3">
                                    <label class="form-label" for="pain">Dor (0 a 10)</label>
                                    <input id="pain" type="number" min="0" max="10" class="form-control">
                                </div>
                                <div class="col-6 col-md-3">
                                    <label class="form-label" for="mobility">Mobilidade</label>
                                    <select id="mobility" class="form-select">
                                        <option value="">—</option>
                                        <option>Ótima</option>
                                        <option>Boa</option>
                                        <option>Regular</option>
                                        <option>Limitada</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="assessmentNote">Observações da profissional</label>
                                <textarea id="assessmentNote" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="beforePhoto">Foto (antes)</label>
                                    <input id="beforePhoto" type="file" accept="image/*" class="form-control"
                                        onchange="previewImage(this, 'beforePreview')">
                                    <div id="beforePreview" class="photo-preview mt-2"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="afterPhoto">Foto (depois)</label>
                                    <input id="afterPhoto" type="file" accept="image/*" class="form-control"
                                        onchange="previewImage(this, 'afterPreview')">
                                    <div id="afterPreview" class="photo-preview mt-2"></div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="assessmentSaveButton" onclick="saveAssessment(this)">Salvar avaliação</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Registrar pagamento</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="paymentForm">
                            <div class="mb-3">
                                <label class="form-label" for="paymentPatient">Paciente</label>
                                <select id="paymentPatient" class="form-select" required></select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="paymentDescription">Descrição</label>
                                <input id="paymentDescription" class="form-control" placeholder="Ex.: Pacote de 10 sessões" required>
                            </div>
                            <div class="row g-3">
                                <div class="col-6">
                                    <label class="form-label" for="paymentValue">Valor (R$)</label>
                                    <input id="paymentValue" type="number" step="0.01" min="0.01" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label" for="paymentMethod">Forma de pagamento</label>
                                    <select id="paymentMethod" class="form-select" required>
                                        <option>Pix</option>
                                        <option>Dinheiro</option>
                                        <option>Cartão de crédito</option>
                                        <option>Cartão de débito</option>
                                    </select>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="savePayment(this)">Registrar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/utils/format.js"></script>
    <script src="./js/utils/security.js"></script>
    <script src="./js/ui/sidebar.js"></script>
    <script src="./js/ui/theme.js"></script>
    <script src="./js/ui/toast.js"></script>
    <script src="./js/ui/confirm.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/pages/pacientes.js"></script>
    <script src="./js/pages/agenda.js"></script>
    <script src="./js/pages/avaliacoes.js"></script>
    <script src="./js/pages/pagamentos.js"></script>
    <script src="./js/pages/dashboard.js"></script>

    <script src="./js/app.js"></script>

</body>

</html>
